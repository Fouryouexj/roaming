<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trending Destinations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --orange-primary: #FF6B35;
            --orange-secondary: #FF9E1F;
            --cream: #FFF5EB;
        }

        body {
            background: var(--cream);
        }

        .section-heading {
            color: var(--orange-primary);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .destination-card {
            height: 300px;
            perspective: 1000px;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .destination-card:hover {
            transform: translateY(-10px);
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .destination-card:hover .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: flex-end;
            background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.7));
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(45deg, var(--orange-primary), var(--orange-secondary));
            padding: 20px;
            color: white;
        }

        .instagram-feed {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .hashtag-chip {
            background: var(--orange-primary);
            color: white;
            border-radius: 20px;
            padding: 5px 15px;
            transition: all 0.3s;
        }

        .hashtag-chip:hover {
            transform: scale(1.05);
            box-shadow: 0 3px 15px rgba(255,107,53,0.4);
        }

        .btn-explore {
            background: white;
            color: var(--orange-primary);
            border: 2px solid white;
            transition: all 0.3s;
        }

        .btn-explore:hover {
            background: transparent;
            color: white;
        }

        @media (max-width: 768px) {
            .destination-card {
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>
<body>

<section class="container py-5">
    <h2 class="section-heading text-center mb-5 display-4 fw-bold">🔥 Trending Now</h2>

    <div class="row g-4 mb-5">
        <!-- Destination Cards -->
        <div class="col-md-6 col-lg-3">
            <div class="destination-card">
                <div class="card-inner">
                    <div class="card-front" style="background-image: url('https://source.unsplash.com/random/800x600?cappadocia')">
                        <h3 class="text-white p-3 mb-0">Cappadocia</h3>
                    </div>
                    <div class="card-back">
                        <div class="content">
                            <p class="small">500+ hot air balloons at sunrise daily</p>
                            <button class="btn btn-explore btn-sm mt-2">Read Story →</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Repeat similar card structure for other destinations -->
    </div>

    <!-- Instagram Feed -->
    <div class="instagram-feed p-4">
        <h4 class="text-orange mb-4">📸 Traveler Moments</h4>
        <div class="row g-3">
            <div class="col-md-4">
                <div class="social-post position-relative">
                    <img src="https://source.unsplash.com/random/400x400?travel" class="img-fluid rounded-3" alt="Instagram post">
                    <div class="position-absolute bottom-0 start-0 p-3">
                        <span class="hashtag-chip">#VisitCappadocia</span>
                    </div>
                </div>
            </div>
            <!-- Add more social posts -->
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Add mobile touch support for flip cards
    document.querySelectorAll('.destination-card').forEach(card => {
        card.addEventListener('touchstart', function(e) {
            if (!this.classList.contains('hover')) {
                this.classList.add('hover');
            } else {
                this.classList.remove('hover');
            }
            e.preventDefault();
        });
    });
</script>

</body>
</html>
