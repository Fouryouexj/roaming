<script>
    document.addEventListener('DOMContentLoaded', () => {
    const toggle = document.querySelector('.navbar-toggler'); 
    const navbar = document.querySelector('#navbarNav'); 
    const dropdownToggles = document.querySelectorAll('.dropdown-toggle');
    const dropdownMenus = document.querySelectorAll('.dropdown-menu');

    // Mobile toggle functionality
    toggle.addEventListener('click', () => {
        const isExpanded = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', !isExpanded);
        navbar.classList.toggle('show');
    });

    // Dropdown functionality for both desktop and mobile
    dropdownToggles.forEach((dropdownToggle, index) => {
        const dropdownMenu = dropdownMenus[index];
        
        dropdownToggle.addEventListener('click', (e) => {
            e.preventDefault();
            
            // Close other dropdowns
            dropdownMenus.forEach((menu, menuIndex) => {
                if (menuIndex !== index) {
                    menu.classList.remove('show');
                    dropdownToggles[menuIndex].setAttribute('aria-expanded', 'false');
                }
            });
            
            // Toggle current dropdown
            const isExpanded = dropdownToggle.getAttribute('aria-expanded') === 'true';
            dropdownToggle.setAttribute('aria-expanded', !isExpanded);
            dropdownMenu.classList.toggle('show');
        });
    });

    // Close dropdowns when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.navbar')) {
            navbar.classList.remove('show');
            toggle.setAttribute('aria-expanded', 'false');
            
            dropdownMenus.forEach((menu, index) => {
                menu.classList.remove('show');
                dropdownToggles[index].setAttribute('aria-expanded', 'false');
            });
        }
    });

    // Close mobile menu when dropdown item is clicked
    document.querySelectorAll('.dropdown-item').forEach(item => {
        item.addEventListener('click', () => {
            navbar.classList.remove('show');
            toggle.setAttribute('aria-expanded', 'false');
        });
    });
});

// Header scroll effect
window.addEventListener('scroll', function () {
    const header = document.querySelector('.header');
    if (window.scrollY > 50) {
        header.classList.add('scrolled');
    } else {
        header.classList.remove('scrolled');
    }
});
</script>

</body>
