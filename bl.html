<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roaming Nomads Blog</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="blog.css">
    <link rel="shortcut icon" href="img/favicon.jpg" type="image">
    <script src="https://kit.fontawesome.com/b6021ddfae.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f7f7;
            color: #333;
        }
        .blog-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .blog-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .blog-header h1 {
            font-size: 3rem;
            color: #FF6B35;
        }
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .blog-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .blog-card:hover {
            transform: translateY(-10px);
        }
        .blog-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .blog-card h4 {
            font-size: 1.5rem;
            margin: 20px;
            color: #FF6B35;
        }
        .blog-card p {
            margin: 0 20px 20px;
            color: #666;
        }
        .blog-card button {
            display: block;
            width: 80%;
            margin: 0 auto 20px;
            padding: 10px;
            background-color: #FF6B35;
            color: #fff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .blog-card button:hover {
            background-color: #e65a2e;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal-content {
            background-color: #fff;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            border-radius: 10px;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <a class="navbar-brand" href="index.html">Roaming Nomads</a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="about.html">About Us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="blog.html">Blog</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contact.html">Contact</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>
    <main>
        <div class="blog-container">
            <div class="blog-header">
                <h1>Our Blog</h1>
                <p>Discover the latest travel tips, guides, and stories from our adventures.</p>
            </div>
            <div class="blog-grid" id="blogPostsContainer">
                <!-- Blog posts will be dynamically inserted here -->
            </div>
        </div>
    </main>
    <footer class="text-center py-4">
        <p>&copy; 2025 Roaming Nomads. All rights reserved.</p>
    </footer>
    <div id="blogModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h4 id="modalTitle"></h4>
            <img id="modalImage" src="" alt="" style="width: 100%; height: auto;">
            <p id="modalContent"></p>
        </div>
    </div>
    <script>
        // Load blog posts from local storage
        const blogPosts = JSON.parse(localStorage.getItem('blogPosts')) || [];
        const blogPostsContainer = document.getElementById('blogPostsContainer');
        const blogModal = document.getElementById('blogModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalImage = document.getElementById('modalImage');
        const modalContent = document.getElementById('modalContent');
        const closeModal = document.getElementsByClassName('close')[0];

        blogPosts.forEach(post => {
            const blogCard = document.createElement('div');
            blogCard.className = 'blog-card';
            blogCard.innerHTML = `
                <img src="${post.image}" alt="${post.title}">
                <h4>${post.title}</h4>
                <p>${post.content.substring(0, 100)}...</p>
                <button onclick="openModal('${post.id}')">Read more</button>
            `;
            blogPostsContainer.appendChild(blogCard);
        });

        function openModal(id) {
            const post = blogPosts.find(post => post.id === id);
            modalTitle.innerText = post.title;
            modalImage.src = post.image;
            modalContent.innerText = post.content;
            blogModal.style.display = 'block';
        }

        closeModal.onclick = function() {
            blogModal.style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == blogModal) {
                blogModal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
