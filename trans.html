<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    
<style>
:root {
  --gtl-primary: #FF6B35;
  --gtl-gold: #FFD700;
  --gtl-blue: #007bff;
  --gtl-bg: #fff;
  --gtl-dark: #222;
  --gtl-shadow: 0 4px 24px rgba(0,0,0,0.13);
  --gtl-shadow-hover: 0 8px 32px rgba(255,107,53,0.25);
}

#google_translate_element {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 9999;
  background: var(--gtl-bg);
  border-radius: 2.2rem;
  box-shadow: var(--gtl-shadow);
  padding: 0.5rem 1.2rem 0.5rem 0.7rem;
  display: flex;
  align-items: center;
  gap: 0.7rem;
  font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
  border: 2px solid var(--gtl-primary);
  min-width: 170px;
  cursor: move;
  user-select: none;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(10px);
  transform: scale(1);
}

#google_translate_element:hover {
  box-shadow: var(--gtl-shadow-hover);
  border-color: var(--gtl-gold);
  transform: scale(1.02);
}

#google_translate_element.dragging {
  transform: scale(1.05) rotate(2deg);
  box-shadow: 0 12px 40px rgba(255,107,53,0.3);
  transition: none;
}

#google_translate_element.minimized {
  min-width: 50px;
  padding: 0.5rem;
  border-radius: 50%;
  overflow: hidden;
}

#google_translate_element.minimized .gtl-content {
  display: none;
}

#google_translate_element.minimized .gtl-toggle {
  display: flex !important;
  margin: 0 auto;
}

.gtl-header {
  display: flex;
  align-items: center;
  width: 100%;
  justify-content: space-between;
}

.gtl-toggle {
  display: flex !important;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: var(--gtl-primary);
  font-size: 1.2rem;
  cursor: pointer;
  padding: 0.2rem;
  border-radius: 50%;
  transition: all 0.2s ease;
  width: 30px;
  height: 30px;
}

.gtl-toggle:hover {
  background: rgba(255, 107, 53, 0.1);
  transform: rotate(180deg);
}

.gtl-toggle i {
  font-size: 1.4rem;
  color: var(--gtl-primary);
}

.gtl-content {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  width: 100%;
}

.gtl-label {
  font-weight: 700;
  color: var(--gtl-primary);
  font-size: 1.08rem;
  display: flex;
  align-items: center;
  gap: 0.4em;
  letter-spacing: 0.01em;
  transition: all 0.3s ease;
}

.gtl-flag {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  object-fit: cover;
  border: 1.5px solid var(--gtl-gold);
  box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  transition: all 0.3s ease;
}

.gtl-flag:hover {
  transform: scale(1.1) rotate(5deg);
}

.goog-te-gadget {
  font-size: 1rem !important;
  color: var(--gtl-dark) !important;
  font-family: inherit !important;
  display: flex !important;
  align-items: center !important;
}

.goog-te-gadget .goog-te-combo {
  border-radius: 1.2em;
  padding: 0.45em 1.2em 0.45em 2.2em;
  font-size: 1.01rem;
  border: 2px solid var(--gtl-primary);
  background: linear-gradient(90deg, #fff 80%, #ffe5d0 100%);
  color: var(--gtl-dark);
  outline: none;
  font-weight: 600;
  min-width: 120px;
  box-shadow: 0 2px 8px rgba(255,107,53,0.07);
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='18' height='18' viewBox='0 0 20 20' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M5 8L10 13L15 8' stroke='%23FF6B35' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: 0.7em center;
  background-size: 1.1em;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}

.goog-te-gadget .goog-te-combo:hover {
  border-color: var(--gtl-gold);
  background: linear-gradient(90deg, #fff 70%, #fff3e0 100%);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(255,107,53,0.15);
}

.goog-te-gadget .goog-te-combo:focus {
  border-color: var(--gtl-blue);
  box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
  transform: translateY(-1px);
}

.goog-te-gadget .goog-te-combo:active {
  transform: translateY(0);
}

/* Remove Google's banner frame */
.goog-te-banner-frame {
  display: none !important;
}

body {
  top: 0 !important;
}

.goog-te-gadget > * {
  display: none;
}

.goog-te-gadget .goog-te-combo {
  display: block !important;
}

.goog-te-gadget .goog-te-combo option {
  font-size: 1rem;
  color: var(--gtl-dark);
  background: #fff;
  padding: 0.5rem;
}

/* Pulse animation for attention */
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

#google_translate_element.pulse {
  animation: pulse 2s infinite;
}

/* Slide in animation on load */
@keyframes slideIn {
  from {
    transform: translateX(100%) scale(0.8);
    opacity: 0;
  }
  to {
    transform: translateX(0) scale(1);
    opacity: 1;
  }
}

#google_translate_element.slide-in {
  animation: slideIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Mobile optimizations */
@media (max-width: 768px) {
  #google_translate_element {
    top: 10px;
    right: 10px;
    min-width: 140px;
    padding: 0.4rem 0.8rem 0.4rem 0.5rem;
    font-size: 0.95rem;
    border-radius: 2rem;
  }
  
  .gtl-label { 
    font-size: 0.95rem; 
  }
  
  .gtl-flag { 
    width: 20px; 
    height: 20px; 
  }
  
  .goog-te-gadget .goog-te-combo { 
    font-size: 0.95rem; 
    min-width: 100px;
    padding: 0.4em 1em 0.4em 2em;
  }

  #google_translate_element.minimized {
    min-width: 45px;
    padding: 0.4rem;
  }
}

@media (max-width: 480px) {
  #google_translate_element {
    top: 8px;
    right: 8px;
    min-width: 120px;
    padding: 0.3rem 0.6rem 0.3rem 0.4rem;
  }
  
  .gtl-label { 
    font-size: 0.9rem; 
  }
  
  .gtl-flag { 
    width: 18px; 
    height: 18px; 
  }
  
  .goog-te-gadget .goog-te-combo { 
    font-size: 0.9rem; 
    min-width: 85px;
  }
}

/* Touch feedback for mobile */
@media (hover: none) and (pointer: coarse) {
  #google_translate_element:active {
    transform: scale(0.98);
  }
  
  .goog-te-gadget .goog-te-combo:active {
    background: linear-gradient(90deg, #f5f5f5 70%, #ffe0b3 100%);
  }
}

</style>

<div id="google_translate_element" class="slide-in">
  <div class="gtl-header">
    <div class="gtl-content">
      <span class="gtl-label">
        <img class="gtl-flag" src="https://flagcdn.com/gb.svg" alt="English">
        <span class="gtl-text">English</span>
      </span>
    </div>
    <button type="button" class="gtl-toggle" aria-label="Toggle translator size">
      <i class="fas fa-language"></i>
    </button>
  </div>
</div>

<script type="text/javascript">
 function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    includedLanguages: 'en,fr,es,de,zh-CN,ja,ko,th,sw,ar,pt,ru,it,nl,pl,tr,hi,bn',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
    autoDisplay: false
  }, 'google_translate_element');
}

// Draggable functionality
let isDragging = false;
let currentX;
let currentY;
let initialX;
let initialY;
let xOffset = 0;
let yOffset = 0;

document.addEventListener('DOMContentLoaded', function() {
  const translateElement = document.getElementById('google_translate_element');
  const toggleButton = document.querySelector('.gtl-toggle');
  
  // Add click event listener directly to the toggle button
  toggleButton.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation(); // Prevent drag from starting
    toggleTranslator();
  });
  
  // Flag and label mapping
  const flagMap = {
    en: 'https://flagcdn.com/gb.svg',
    fr: 'https://flagcdn.com/fr.svg',
    es: 'https://flagcdn.com/es.svg',
    de: 'https://flagcdn.com/de.svg',
    'zh-CN': 'https://flagcdn.com/cn.svg',
    ja: 'https://flagcdn.com/jp.svg',
    ko: 'https://flagcdn.com/kr.svg',
    th: 'https://flagcdn.com/th.svg',
    sw: 'https://flagcdn.com/tz.svg',
    ar: 'https://flagcdn.com/sa.svg',
    pt: 'https://flagcdn.com/pt.svg',
    ru: 'https://flagcdn.com/ru.svg',
    it: 'https://flagcdn.com/it.svg',
    nl: 'https://flagcdn.com/nl.svg',
    pl: 'https://flagcdn.com/pl.svg',
    tr: 'https://flagcdn.com/tr.svg',
    hi: 'https://flagcdn.com/in.svg',
    bn: 'https://flagcdn.com/bd.svg'
  };
  
  const labelMap = {
    en: 'English',
    fr: 'Français',
    es: 'Español',
    de: 'Deutsch',
    'zh-CN': '中文',
    ja: '日本語',
    ko: '한국어',
    th: 'ไทย',
    sw: 'Kiswahili',
    ar: 'العربية',
    pt: 'Português',
    ru: 'Русский',
    it: 'Italiano',
    nl: 'Nederlands',
    pl: 'Polski',
    tr: 'Türkçe',
    hi: 'हिन्दी',
    bn: 'বাংলা'
  };

  function updateFlagAndLabel(lang) {
    const flag = flagMap[lang] || flagMap['en'];
    const label = labelMap[lang] || 'Language';
    const flagImg = document.querySelector('.gtl-flag');
    const labelText = document.querySelector('.gtl-text');
    
    if (flagImg && labelText) {
      flagImg.src = flag;
      flagImg.alt = label;
      labelText.textContent = label;
      
      // Add a subtle animation when changing
      flagImg.style.transform = 'scale(1.2) rotate(10deg)';
      setTimeout(() => {
        flagImg.style.transform = 'scale(1) rotate(0deg)';
      }, 300);
    }
  }

  // Wait for Google widget to load
  let tries = 0;
  function attachComboListener() {
    const combo = document.querySelector('.goog-te-combo');
    if (combo) {
      updateFlagAndLabel(combo.value || 'en');
      combo.addEventListener('change', function() {
        updateFlagAndLabel(combo.value);
        // Add pulse effect when language changes
        translateElement.classList.add('pulse');
        setTimeout(() => {
          translateElement.classList.remove('pulse');
        }, 2000);
      });
    } else if (tries < 30) {
      tries++;
      setTimeout(attachComboListener, 200);
    }
  }
  
  attachComboListener();

  // Remove Google's banner frame
  const removeGoogleFrame = setInterval(() => {
    const frame = document.querySelector('.goog-te-banner-frame');
    if (frame) {
      frame.remove();
      document.body.style.top = '0px';
      clearInterval(removeGoogleFrame);
    }
  }, 100);

  // Draggable functionality for desktop
  translateElement.addEventListener('mousedown', dragStart);
  document.addEventListener('mousemove', drag);
  document.addEventListener('mouseup', dragEnd);

  // Touch events for mobile
  translateElement.addEventListener('touchstart', dragStart, { passive: false });
  document.addEventListener('touchmove', drag, { passive: false });
  document.addEventListener('touchend', dragEnd);

  function dragStart(e) {
    // Don't drag when clicking dropdown or toggle button
    if (e.target.closest('.goog-te-combo') || e.target.closest('.gtl-toggle')) {
      return;
    }
    
    e.preventDefault();
    
    if (e.type === "touchstart") {
      initialX = e.touches[0].clientX - xOffset;
      initialY = e.touches[0].clientY - yOffset;
    } else {
      initialX = e.clientX - xOffset;
      initialY = e.clientY - yOffset;
    }

    if (e.target === translateElement || translateElement.contains(e.target)) {
      isDragging = true;
      translateElement.classList.add('dragging');
    }
  }

  function drag(e) {
    if (isDragging) {
      e.preventDefault();

      if (e.type === "touchmove") {
        currentX = e.touches[0].clientX - initialX;
        currentY = e.touches[0].clientY - initialY;
      } else {
        currentX = e.clientX - initialX;
        currentY = e.clientY - initialY;
      }

      xOffset = currentX;
      yOffset = currentY;

      // Constrain to viewport
      const rect = translateElement.getBoundingClientRect();
      const maxX = window.innerWidth - rect.width;
      const maxY = window.innerHeight - rect.height;
      
      xOffset = Math.max(0, Math.min(maxX, xOffset));
      yOffset = Math.max(0, Math.min(maxY, yOffset));

      setTranslate(xOffset, yOffset, translateElement);
    }
  }

  function dragEnd(e) {
    initialX = currentX;
    initialY = currentY;
    isDragging = false;
    translateElement.classList.remove('dragging');

    // Snap to edges on mobile
    if (window.innerWidth <= 768) {
      const rect = translateElement.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      
      if (centerX < window.innerWidth / 2) {
        // Snap to left
        xOffset = 10;
      } else {
        // Snap to right
        xOffset = window.innerWidth - rect.width - 10;
      }
      
      setTranslate(xOffset, yOffset, translateElement);
    }
  }

  function setTranslate(xPos, yPos, el) {
    el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
  }

  // Double tap to minimize on mobile
  let lastTap = 0;
  translateElement.addEventListener('touchend', function(e) {
    if (e.target.closest('.gtl-toggle')) return;
    
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTap;
    if (tapLength < 500 && tapLength > 0) {
      toggleTranslator();
    }
    lastTap = currentTime;
  });
});

// Toggle minimized state
function toggleTranslator() {
  const translateElement = document.getElementById('google_translate_element');
  translateElement.classList.toggle('minimized');
}

// Auto-hide on scroll (mobile)
let scrollTimer;
window.addEventListener('scroll', function() {
  if (window.innerWidth <= 768) {
    const translateElement = document.getElementById('google_translate_element');
    translateElement.style.opacity = '0.7';
    
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      translateElement.style.opacity = '1';
    }, 1000);
  }
});

// Keyboard accessibility
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    const translateElement = document.getElementById('google_translate_element');
    translateElement.classList.remove('minimized');
  }
});

dropdownToggles.forEach((dropdownToggle, index) => {
    const dropdownMenu = dropdownMenus[index];
    
    dropdownToggle.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation(); // Prevent drag from starting
        
        // Close other dropdowns
        dropdownMenus.forEach((menu, menuIndex) => {
            if (menuIndex !== index) {
                menu.classList.remove('show');
                dropdownToggles[menuIndex].setAttribute('aria-expanded', 'false');
            }
        });
        
        // Toggle current dropdown
        const isExpanded = dropdownToggle.getAttribute('aria-expanded') === 'true';
        dropdownToggle.setAttribute('aria-expanded', !isExpanded);
        dropdownMenu.classList.toggle('show');
    });
});

// Close dropdowns when clicking outside
document.addEventListener('click', (e) => {
    if (!e.target.closest('.navbar')) {
        dropdownMenus.forEach((menu) => {
            menu.classList.remove('show');
        });
        dropdownToggles.forEach((toggle) => {
            toggle.setAttribute('aria-expanded', 'false');
        });
    }
});

</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script> 
</body>
</html>
