<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Header</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .image img {
            height: 120px;
            object-fit: contain;
        }
        
        .navbar-custom .nav-link {
            color: black !important;
            font-size: 1.1rem;
            font-weight: 500;
        }
        
        .active .nav-link {
            text-decoration: underline 3px orange;
            text-underline-offset: 0.5rem;
        }
        
        .dropdown-menu-custom {
            background-color: rgba(0, 0, 0, 0.966) !important;
            border: none;
        }
        
        .dropdown-item-custom {
            color: white !important;
            padding: 0.5rem 1rem;
        }
        
        .dropdown-item-custom:hover {
            background-color: rgba(255, 255, 255, 0.2) !important;
        }
        
        .social-icons .fa-brands {
            font-size: 1.2rem;
        }

        @media (max-width: 991px) {
            .header-right-col {
                position: relative;
            }
            
            .nav-social-icons {
                position: absolute;
                top: 0;
                right: 60px;
            }
            
            .mobile-contact-info {
                text-align: right;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <header class="container-fluid py-2 bg-white">
        <div class="row align-items-center">
            <!-- Logo -->
            <div class="col-md-3 col-lg-2">
                <div class="image">
                    <img src="img/IMG-20250222-WA0014.jpg" alt="Logo" class="img-fluid">
                </div>
            </div>
            
            <!-- Right Section -->
            <div class="col-md-9 col-lg-10 header-right-col">
                <!-- Desktop Contact Info -->
                <div class="d-none d-lg-flex justify-content-end gap-3 mb-2">
                    <div>
                        <i class="fas fa-phone me-2"></i>+254 740 596771
                    </div>
                    <div>
                        <i class="fas fa-envelope me-2"></i>roamingnomadsafaris@gmail.com
                    </div>
                </div>

                <!-- Mobile Contact Info -->
                <div class="d-lg-none mobile-contact-info">
                    <div class="d-flex flex-column">
                        <div>
                            <i class="fas fa-phone me-2"></i>+254 740 596771
                        </div>
                        <div>
                            <i class="fas fa-envelope me-2"></i>roamingnomadsafaris@gmail.com
                        </div>
                    </div>
                </div>

                <!-- Navigation and Tools Container -->
                <div class="d-flex justify-content-between align-items-center">
                    <!-- Social Icons -->
                    <div class="social-icons nav-social-icons d-flex gap-3 me-3">
                        <a href="#" class="text-dark"><i class="fa-brands fa-tiktok"></i></a>
                        <a href="#" class="text-danger"><i class="fa-brands fa-instagram"></i></a>
                        <a href="#" class="text-primary"><i class="fa-brands fa-facebook"></i></a>
                    </div>

                    <!-- Navigation -->
                    <nav class="navbar navbar-expand-lg p-0 flex-grow-1">
                        <div class="container-fluid p-0 justify-content-end">
                            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                                <span class="navbar-toggler-icon"></span>
                            </button>
                            
                            <div class="collapse navbar-collapse" id="navbarNav">
                                <ul class="navbar-nav">
                                    <li class="nav-item active">
                                        <a class="nav-link" href="index.html">Home</a>
                                    </li>
                                    
                                    <li class="nav-item dropdown">
                                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                                            Packages
                                        </a>
                                        <ul class="dropdown-menu dropdown-menu-custom">
                                            <li><a class="dropdown-item dropdown-item-custom" href="#">Day trips</a></li>
                                            <li><a class="dropdown-item dropdown-item-custom" href="#">Group trips</a></li>
                                            <li><a class="dropdown-item dropdown-item-custom" href="corp.html">Corporate tours</a></li>
                                            <li><a class="dropdown-item dropdown-item-custom" href="#">Luxury tours</a></li>
                                        </ul>
                                    </li>
                                    
                                    <li class="nav-item">
                                        <a class="nav-link" href="about.html">About us</a>
                                    </li>
                                    
                                    <li class="nav-item">
                                        <a class="nav-link" href="blog.html">Blog</a>
                                    </li>
                                    
                                    <li class="nav-item">
                                        <a class="nav-link" href="faqs.html">FAQs</a>
                                    </li>
                                    
                                    <li class="nav-item">
                                        <a class="nav-link" href="cont.html">Contacts</a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
