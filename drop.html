    <style>
        .dropdown-menu {
    border: none;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    border-radius: 16px;
    padding: 1rem 0;
    margin-top: 0.5rem;
    background: blue;
    backdrop-filter: blur(10px);
    animation: dropdownSlideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    min-width: 220px;
    border: 1px solid rgba(243, 172, 18, 0.2);
}

.dropdown-item {
    padding: 0.875rem 1.5rem;
    color: wheat;
    font-weight: 500;
    transition: all 0.3s ease;
    border-radius: 8px;
    margin: 0.25rem 0.5rem;
    position: relative;
    overflow: hidden;
}

.dropdown-item::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(7, 68, 233, 0.1), transparent);
    transition: left 0.5s ease;
}

.dropdown-item:hover::before {
    left: 100%;
}

.dropdown-item:hover {
    background-color: rgba(9, 145, 236, 0.1);
    color: var(--primary);
    transform: translateX(8px);
    box-shadow: 0 4px 12px rgba(243, 172, 18, 0.2);
}

/* Mobile Responsive Styles */
@media (max-width: 991.98px) {
    .dropdown-menu {
        position: static;
        float: none;
        width: 100%;
        margin: 0.75rem 0;
        box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.1);
        background: rgb(248, 6, 6);
        border: 2px solid rgba(243, 172, 18, 0.2);
        border-radius: 12px;
    }

    .dropdown-item {
        padding: 1rem 1.5rem;
        margin: 0.5rem;
        border-radius: 8px;
        background: wheat;
        border: 1px solid rgba(243, 172, 18, 0.1);
        color: var(--text-light);
    }
}

/* Animation */
@keyframes dropdownSlideIn {
    from {
        opacity: 0;
        transform: translateY(-15px) scale(0.95);
    }
    to {
        opacity: 0.5;
        transform: translateY(0) scale(1);
    }
}
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
    const toggle = document.querySelector('.navbar-toggler');
    const navbar = document.querySelector('#navbarNav');
    const dropdownToggles = document.querySelectorAll('.dropdown-toggle');
    const dropdownMenus = document.querySelectorAll('.dropdown-menu');

    // Mobile toggle functionality
    toggle.addEventListener('click', () => {
        const isExpanded = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', !isExpanded);
        navbar.classList.toggle('show');
    });

    // Dropdown functionality for both desktop and mobile
    dropdownToggles.forEach((dropdownToggle, index) => {
        const dropdownMenu = dropdownMenus[index];
        
        dropdownToggle.addEventListener('click', (e) => {
            e.preventDefault();
            
            // Close other dropdowns
            dropdownMenus.forEach((menu, menuIndex) => {
                if (menuIndex !== index) {
                    menu.classList.remove('show');
                    dropdownToggles[menuIndex].setAttribute('aria-expanded', 'false');
                }
            });
            
            // Toggle current dropdown
            const isExpanded = dropdownToggle.getAttribute('aria-expanded') === 'true';
            dropdownToggle.setAttribute('aria-expanded', !isExpanded);
            dropdownMenu.classList.toggle('show');
        });
    });

    // Close dropdowns when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.navbar')) {
            navbar.classList.remove('show');
            toggle.setAttribute('aria-expanded', 'false');
            
            dropdownMenus.forEach((menu, index) => {
                menu.classList.remove('show');
                dropdownToggles[index].setAttribute('aria-expanded', 'false');
            });
        }
    });

    // Close mobile menu when dropdown item is clicked
    document.querySelectorAll('.dropdown-item').forEach(item => {
        item.addEventListener('click', () => {
            navbar.classList.remove('show');
            toggle.setAttribute('aria-expanded', 'false');
        });
    });
});
    </script>
