<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review System</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        .review-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            height: 300px;
        }

        .reviews-wrapper {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .review-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin: 10px;
            flex: 0 0 calc(50% - 20px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.5s ease;
        }

        .review-card.active {
            opacity: 1;
            transform: translateX(0);
        }

        .stars {
            color: #ffd700;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .review-form {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-top: 5px;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        .rating-stars {
            display: flex;
            gap: 5px;
            margin: 10px 0;
        }

        .rating-star {
            cursor: pointer;
            font-size: 24px;
            color: #ddd;
            transition: color 0.2s;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="review-container">
        <div class="reviews-wrapper">
            <!-- Initial reviews -->
            <div class="review-card active">
                <div class="stars">★★★★★</div>
                <h3>John Doe</h3>
                <p>Absolutely amazing service! The team went above and beyond to help me with my project.</p>
            </div>
            <div class="review-card">
                <div class="stars">★★★★☆</div>
                <h3>Jane Smith</h3>
                <p>Good overall experience, but delivery was slightly delayed. Would recommend!</p>
            </div>
        </div>
    </div>

    <div class="review-form">
        <h2>Add Your Review</h2>
        <form id="reviewForm">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Rating:</label>
                <div class="rating-stars" id="ratingStars">
                    <span class="rating-star" data-rating="1">★</span>
                    <span class="rating-star" data-rating="2">★</span>
                    <span class="rating-star" data-rating="3">★</span>
                    <span class="rating-star" data-rating="4">★</span>
                    <span class="rating-star" data-rating="5">★</span>
                </div>
            </div>
            <div class="form-group">
                <label>Review:</label>
                <textarea id="review" rows="4" required></textarea>
            </div>
            <button type="submit">Submit Review</button>
        </form>
    </div>

    <script>
        // Carousel functionality
        let currentIndex = 0;
        const reviews = document.querySelectorAll('.review-card');
        
        function showNextReview() {
            reviews[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % reviews.length;
            reviews[currentIndex].classList.add('active');
        }

        setInterval(showNextReview, 5000);

        // Star rating functionality
        const stars = document.querySelectorAll('.rating-star');
        let selectedRating = 0;

        stars.forEach(star => {
            star.addEventListener('click', () => {
                selectedRating = parseInt(star.dataset.rating);
                stars.forEach((s, index) => {
                    s.style.color = index < selectedRating ? '#ffd700' : '#ddd';
                });
            });
        });

        // Form submission
        document.getElementById('reviewForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const reviewText = document.getElementById('review').value;

            if (!name || !email || !reviewText || selectedRating === 0) {
                alert('Please fill all fields and select a rating!');
                return;
            }

            // Create new review element
            const newReview = document.createElement('div');
            newReview.className = 'review-card';
            newReview.innerHTML = `
                <div class="stars">${'★'.repeat(selectedRating)}${'☆'.repeat(5 - selectedRating)}</div>
                <h3>${name}</h3>
                <p>${reviewText}</p>
            `;

            // Add to reviews wrapper
            document.querySelector('.reviews-wrapper').appendChild(newReview);
            reviews = document.querySelectorAll('.review-card'); // Update reviews list

            // Reset form
            document.getElementById('reviewForm').reset();
            stars.forEach(star => star.style.color = '#ddd');
            selectedRating = 0;
        });
    </script>
</body>
</html>
